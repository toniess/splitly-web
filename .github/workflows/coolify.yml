name: Deploy to Coolify

# Push-to-deploy is enabled with repository variable COOLIFY_DEPLOY_ENABLED.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coolify-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.COOLIFY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: registry.toniess.dev/splitly/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        env:
          REGISTRY_USER: ${{ secrets.COOLIFY_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.COOLIFY_REGISTRY_PASSWORD }}
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          test -n "$REGISTRY_USER" && test -n "$REGISTRY_PASSWORD"
          test -n "$DEPLOY_WEBHOOK" && test -n "$DEPLOY_TOKEN"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.toniess.dev
          username: ${{ secrets.COOLIFY_REGISTRY_USER }}
          password: ${{ secrets.COOLIFY_REGISTRY_PASSWORD }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_API_BASE=${{ vars.COOLIFY_API_BASE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Request deployment
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST "$DEPLOY_WEBHOOK" \
            --header "Authorization: Bearer $DEPLOY_TOKEN"
          # A successful webhook queues deployment; check its result in Coolify.
